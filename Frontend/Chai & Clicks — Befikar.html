<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Chai &amp; Clicks — Befikar</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#087F83;--indigo:#6b2d3c;--red:#E74736;--gold:#F4B83F;--orange:#F28C28;--green:#4C965B;--cream:#D8F1EA;--peach:#FFE2BF;--ink:#3a2230;--card:#FFFBF2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{color-scheme:light}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--cream);color:var(--ink);font:19px/1.55 'Nunito Sans',system-ui,sans-serif}
body.easy{font-size:23px}
h1,h2,h3,.f{font-family:Fredoka,'Baloo 2',system-ui,sans-serif;color:var(--indigo);line-height:1.15;margin:.2em 0}
h1{font-size:clamp(36px,6vw,64px)}h2{font-size:clamp(28px,4vw,40px)}h3{font-size:24px}
button{font:600 18px 'Nunito Sans',sans-serif;min-height:52px;padding:10px 24px;border-radius:30px;border:3px solid var(--indigo);background:var(--card);color:var(--ink);cursor:pointer;transition:transform .15s}
button:hover{transform:translateY(-2px)}button:focus-visible,a:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.p{background:var(--red);color:#fff;border-color:#a8281b}.o{background:var(--orange);color:#1b1b1b;border-color:#a35a10}.t{background:var(--teal);color:#fff;border-color:#05585b}.g{background:var(--green);color:#fff;border-color:#2f6a3b}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:6px double var(--gold);display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 18px}
nav .logo{font:700 26px Fredoka;color:var(--teal);margin-right:auto;cursor:pointer;background:none;border:0;padding:0}
nav button.l{border:0;background:none;min-height:48px;padding:6px 12px;border-radius:12px}nav button.on{background:var(--gold);color:#1b1b1b}
.sw[aria-pressed=true]{background:var(--green);color:#fff;border-color:#2f6a3b}
main{max-width:1180px;margin:auto;padding:22px 18px 60px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.cols{display:grid;grid-template-columns:1fr 360px 1fr;gap:20px;align-items:start}
@media(max-width:960px){.row,.three,.cols{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:26px;padding:20px;border:3px solid var(--indigo);box-shadow:6px 6px 0 var(--gold)}
.tag{font-weight:700;color:var(--red)}
.strip{background:var(--teal);color:#fff;border-radius:20px;padding:14px 20px;margin:22px 0;border:3px dashed var(--gold);font-weight:600}
.border{border:10px solid transparent;border-image:repeating-linear-gradient(90deg,var(--red) 0 20px,var(--gold) 20px 40px,var(--teal) 40px 60px,var(--green) 60px 80px) 10;border-radius:0;padding:18px;background:var(--peach)}
svg{max-width:100%;height:auto}
.phone{width:320px;max-width:100%;margin:auto;background:#1b1b1b;border-radius:44px;padding:14px;box-shadow:0 0 0 3px var(--teal),0 0 26px #087F8388}
.scr{background:#fff;color:#252525;border-radius:32px;min-height:470px;padding:18px;display:flex;flex-direction:column;gap:10px}
.scr h3{color:#263C73;font-size:21px}.scr button{width:100%;font-size:17px}
.pop{background:#f0f0f4;border-radius:20px;padding:16px;margin-top:auto;display:flex;flex-direction:column;gap:8px}
.bub{background:var(--gold);color:#1b1b1b;border-radius:18px;padding:10px 14px;font-weight:600;position:relative}
.tl{border-left:5px solid var(--teal);padding-left:14px;margin:0;list-style:none}.tl li{margin:10px 0;position:relative}.tl li:before{content:"";position:absolute;left:-23px;top:8px;width:15px;height:15px;border-radius:50%;background:var(--orange)}
.bd{display:inline-flex;gap:8px;align-items:center;padding:8px 14px;border-radius:30px;background:var(--peach);margin:4px;font-weight:700}.bd.off{opacity:.4;filter:grayscale(1)}
.bar{height:16px;background:var(--peach);border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
dialog{border:6px double var(--gold);border-radius:26px;max-width:560px;background:var(--card);color:var(--ink)}
.blink{animation:bl 4s infinite}.wag{transform-origin:10px 0;animation:wg 2s ease-in-out infinite}.wave{animation:wv 2s ease-in-out infinite;transform-origin:0 0}
@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}@keyframes wg{50%{transform:rotate(14deg)}}@keyframes wv{50%{transform:rotate(-18deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.cc{cursor:pointer;text-align:left;border-radius:26px;padding:0;min-height:0;width:100%}.cc .in{padding:16px}
footer{text-align:center;padding:26px;background:var(--indigo);color:#fff6e4}
</style></head><body>
<nav id="nav"></nav><main id="app"></main>
<footer><b class="f" style="color:var(--gold);font-size:24px">CHAI &amp; CLICKS · BEFIKAR</b><br>Chai ke saath, technology ki baat!<br>Everything here is a simulation. Nothing touches your real phone or data.</footer>
<dialog id="dlg"></dialog>
<script>
// ---------- state ----------
let st={desi:false,easy:false,sound:false,sc:'perm',hist:[],log:[]},pr={done:{},badges:{},seen:{}};
try{pr=Object.assign(pr,JSON.parse(localStorage.getItem('cc')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('cc',JSON.stringify(pr))}catch(e){}};
const t=a=>st.desi?a[1]:a[0];
const BD={first:['First Click','Completed your first activity','👆'],fearless:['Fearless Explorer','Tried multiple choices','🧭'],rewind:['Rewind Master','Used rewind successfully','⏪'],detective:['Digital Detective','Spotted a suspicious message','🕵️'],rescuer:['Photo Rescuer','Restored a fictional deleted photo','🖼️'],befikar:['Befikar Learner','Explored all three scenarios','🌟']};
const give=k=>{if(!pr.badges[k]){pr.badges[k]=1;save();toast('New badge: '+BD[k][0]+' '+BD[k][2])}};
function toast(m){let d=document.createElement('div');d.textContent=m;d.setAttribute('role','status');d.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:14px 24px;border-radius:30px;font-weight:700;z-index:50';document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
// ---------- scenarios ----------
const SC={
perm:{title:'App Permissions',time:'5 min',col:'--teal',ic:'🔐',desc:'Understand what apps can access and when you should allow permission.',
intro:['Sometimes apps ask to access your photos, contacts or location. Let’s understand what happens when you allow or deny access.','Kabhi kabhi apps aapki photos, contacts ya location tak pohanchna chahti hain. Aayiye dekhein ke Allow ya Deny karne par kya hota hai.'],
obj:['Decide how to answer the permission request.','Faisla karein ke permission request ka kya jawab dena hai.'],
hint:['Ask yourself: does a photo app really need my contacts?','Khud se poochein: kya photo app ko waqai contacts ki zaroorat hai?'],
s:{start:{app:'Photo Magic',h:'Photo Magic wants permission to view your contacts.',b:['An app is asking for your contact list.',''],
 o:[['Allow','allow','p'],['Don’t Allow','deny','t'],['Allow Once','once','o']],
 w:['A fictional app has asked for access. Nothing has happened yet. Take your time.','Ek farzi app ne permission maangi hai. Abhi kuch nahi hua. Araam se sochein.'],k:['Apps ask first, so you always get to decide.','App pehle poochti hai, faisla hamesha aapka hota hai.']},
allow:{app:'Photo Magic',h:'Contacts shared ✔',b:['Photo Magic can now see your contacts, until you change it in Settings.',''],end:1,o:[],
 w:['When you press Allow, the app gets permission to see contacts in this simulation.','Jab aap Allow press karte hain, toh is simulation mein app ko contacts dekhne ki permission mil jati hai.'],k:['Allow only when the app truly needs it. You can change this later.','Allow tabhi dein jab app ko waqai zaroorat ho. Baad mein badal bhi sakte hain.']},
deny:{app:'Photo Magic',h:'Access blocked ✖',b:['The app cannot see your contacts, but still works for photos.',''],end:1,o:[],
 w:['Don’t Allow keeps contacts private. The app still opens, with fewer features.','Don’t Allow se contacts private rehte hain. App phir bhi chalti hai, bas kuch features kam hote hain.'],k:['It is perfectly fine to say no to a request that feels unnecessary.','Agar request ghair-zaroori lage toh “No” kehna bilkul theek hai.']},
once:{app:'Photo Magic',h:'Temporary access ⏳',b:['The app can see contacts for this visit only. It must ask again next time.',''],end:1,o:[],
 w:['Allow Once gives access for now. Next time, the app has to ask again.','Allow Once se abhi ke liye access milta hai. Agli baar app ko dobara poochna paray ga.'],k:['A good middle path when you are unsure.','Jab pakka na ho, yeh beech ka acha rasta hai.']}}},
photo:{title:'Recover a Deleted Photo',time:'4 min',col:'--orange',ic:'🖼️',desc:'Practise deleting and restoring a picture without losing anything.',
intro:['Deleted a photo by mistake? Most phones keep it for a while in a “Recently Deleted” folder. Let’s practise.','Photo ghalti se delete ho gayi? Aksar phones usay kuch din “Recently Deleted” folder mein rakhte hain. Chalein practice karein.'],
obj:['Delete the Eid picnic photo, then bring it back.','Eid picnic wali photo delete karein, phir wapas layein.'],
hint:['Look for a folder called Recently Deleted.','“Recently Deleted” naam ka folder dhoondein.'],
s:{start:{app:'Gallery',h:'Eid picnic 📷',b:['A fictional photo of the family picnic.',''],o:[['Delete this photo','gone','p'],['Keep it','keep','t']],
 w:['You are looking at one fictional photo.','Aap ek farzi photo dekh rahe hain.'],k:['Deleting is a button press. Undoing is possible too.','Delete sirf ek button hai, aur wapas bhi aa sakti hai.']},
keep:{app:'Gallery',h:'Photo stays safe',b:['Nothing changed. Press Go Back to try deleting.',''],o:[],w:['You kept the photo. No changes were made.','Aapne photo rakhi. Kuch nahi badla.'],k:['Not pressing is also a choice.','Click na karna bhi ek faisla hai.']},
gone:{app:'Gallery',h:'Photo deleted',b:['The photo left your gallery. Don’t worry, it moved to Recently Deleted.',''],o:[['Open Recently Deleted','bin','o']],w:['The photo moved out of the main gallery but was not erased yet.','Photo main gallery se hat gayi lekin abhi poori tarah khatam nahi hui.'],k:['Deleted photos usually wait in a bin first.','Delete ki hui photos aksar pehle bin mein jati hain.']},
bin:{app:'Recently Deleted',h:'1 item here',b:['Eid picnic · 29 days left',''],o:[['Restore photo','back','g'],['Delete forever','forever','p']],w:['This is the safety bin, where deleted photos wait for a while.','Yeh safety bin hai, jahan delete ki hui photos kuch din rukti hain.'],k:['Restore brings it back to the gallery.','Restore se photo gallery mein wapas aati hai.']},
back:{app:'Gallery',h:'Photo restored 🎉',b:['The Eid picnic photo is back in your gallery.',''],end:1,badge:'rescuer',o:[],w:['Restore returned the photo to the gallery in this simulation.','Is simulation mein Restore ne photo gallery mein wapas rakh di.'],k:['Mistakes can be fixed. Check the bin first.','Ghalti theek ho sakti hai. Pehle bin dekhein.']},
forever:{app:'Recently Deleted',h:'Removed for good',b:['In this simulation the photo is gone. Press Go Back to rewind.',''],end:1,o:[],w:['Delete forever cannot usually be undone on a real phone.','Asli phone par Delete forever aam taur par wapas nahi hota.'],k:['Be careful with “forever” buttons. Here, you can rewind.','“Forever” wale buttons se ehtiyaat karein. Yahan aap rewind kar sakte hain.']}}},
msg:{title:'Recognise Suspicious Messages',time:'5 min',col:'--indigo',ic:'⚠️',desc:'Learn what to check before opening an unfamiliar message or link.',
intro:['Scam messages often promise prizes and rush you. Let’s learn what to check first.','Dhokay wale messages aksar inaam ka lalach dete hain aur jaldi karwate hain. Pehle kya check karna hai, seekhte hain.'],
obj:['Decide what to do with this unknown message.','Faisla karein ke is anjaan message ka kya karna hai.'],
hint:['Unknown number, big prize, and a rushed link are warning signs.','Anjaan number, bara inaam aur jaldi wala link, yeh khatre ki nishaniyan hain.'],
s:{start:{app:'Messages',h:'Unknown number',b:['“Congratulations! You won Rs 500,000. Tap bit.ly/claim-now within 1 hour!”',''],o:[['Tap the link','link','p'],['Ask a family member','ask','g'],['Delete the message','del','t']],
 w:['A fictional message arrived from a number you do not know.','Ek anjaan number se farzi message aaya hai.'],k:['Pause before you tap.','Tap karne se pehle ruk jayein.']},
link:{app:'Browser (fake)',h:'Fake page opened',b:['It asks for your bank PIN. A real prize never needs this. Go Back and try again.',''],end:1,o:[],w:['Tapping opened a fictional scam page asking for private details.','Tap karne se ek farzi dhokay wala page khula jo zaati maloomat maang raha hai.'],k:['Never share PINs or OTPs. Real banks never ask.','PIN ya OTP kisi se share na karein. Asli bank kabhi nahi poochta.']},
ask:{app:'Family chat',h:'Great choice! 🕵️',b:['Ahmed Uncle says: “That is a scam. Prizes you did not enter for are not real.”',''],end:1,badge:'detective',o:[],w:['Asking someone you trust is one of the best checks.','Kisi bharosay-mand se poochna sab se behtareen check hai.'],k:['Unknown sender + prize + hurry = suspicious.','Anjaan sender + inaam + jaldi = shak wali baat.']},
del:{app:'Messages',h:'Message deleted',b:['Safe. You did not tap anything.',''],end:1,badge:'detective',o:[],w:['Deleting a suspicious message is a safe move.','Shak wala message delete karna mehfooz qadam hai.'],k:['Ignoring or deleting is safe. Telling family helps too.','Nazar-andaz ya delete karna mehfooz hai. Ghar walon ko batana bhi acha hai.']}}}};
// ---------- art ----------
const E='<circle cx="86" cy="76" r="4" fill="#222" class="blink"/><circle cx="114" cy="76" r="4" fill="#222" class="blink"/>';

// ---------- views ----------
const V={};
V.home=()=>`<div class="row"><div><p class="tag">YOUR BEFIKAR DIGITAL PLAYGROUND</p><h1>Technology is easier when we learn together.</h1><p>Ever hesitated before pressing a button on your phone? Don’t worry. Explore everyday digital activities, make mistakes and rewind whenever you want. It’s all safe here!</p><p><button class="p" data-go="explore">Start Exploring</button> <button data-go="how">See How It Works</button></p><p class="f" style="font-size:26px;color:var(--teal)">Chai ke saath, technology ki baat!</p><p><b>Make mistakes. Learn freely. Try again.</b></p></div><div>${scene()}</div></div>
<div class="strip">🛡️ Your real phone and personal data are never affected. Everything happens in a simulation.</div>${steps()}<p style="text-align:center"><button data-go="meet">Meet the Family</button></p>`;
const steps=()=>`<div class="three">${[['🧭','Explore','Choose an everyday digital situation.'],['🧪','Experiment','Try different actions without fear.'],['⏪','Rewind','Understand what happened and try again.']].map(s=>`<div class="card"><div style="font-size:44px">${s[0]}</div><h3>${s[1]}</h3><p>${s[2]}</p></div>`).join('')}</div>`;
V.how=()=>`<h1>How It Works</h1><p>Three simple steps, always with chai.</p>${steps()}<div class="strip">Nothing connects to real apps, your camera, contacts or messages. All results are simulated on this page only.</div><p><button class="p" data-go="explore">Start Exploring</button></p>`;
const done=()=>Object.keys(pr.done).length;
V.explore=()=>`<h1>Welcome to your Befikar space!</h1><h2 style="color:var(--teal)">What would you like to practise today?</h2><div class="three">${Object.entries(SC).map(([k,s])=>`<div class="card" style="border-color:var(${s.col});box-shadow:6px 6px 0 var(${s.col})"><div style="font-size:72px;text-align:center;background:var(--peach);border-radius:20px">${s.ic}</div><h3>${s.title}</h3><p>${s.desc}</p><p>⏱ About ${s.time} ${pr.done[k]?'· ✔ Explored':''}</p><button class="o" data-intro="${k}">Explore</button></div>`).join('')}</div>
<div style="margin:26px 0">${bot(t(['Take your time! Nobody is in a hurry here.','Take your time! Yahan koi jaldi nahi hai.']))}</div>
<div class="card"><h2>My Learning Journey</h2><div class="bar" role="progressbar" aria-valuenow="${done()}" aria-valuemax="3"><i style="width:${done()/3*100}%"></i></div><p>${done()} of 3 activities explored. ${done()?'Great exploration!':'There’s no rush.'}</p>${badges()}</div>`;
const badges=()=>Object.entries(BD).map(([k,b])=>`<span class="bd ${pr.badges[k]?'':'off'}" title="${b[1]}">${b[2]} ${b[0]}</span>`).join('');
V.intro=()=>{const s=SC[st.sc];return `<div class="row"><div><p class="tag">Simulated practice · ${s.time}</p><h1>Let’s understand ${s.title}</h1><p>${t(s.intro)}</p><div class="strip">This is a pretend phone. Nothing you press here affects your real phone.</div><button class="t" data-act="listen">🔊 Listen to Instructions</button> <button class="p" data-go="practice">Start Practice</button> <button data-go="explore">Back to Explore</button></div><div style="text-align:center;font-size:120px">${s.ic}${bot(t(['Ready? Let’s begin together.','Tayyar? Chalein saath shuru karte hain.']))}</div></div>`};
function cur(){return st.hist.length?st.hist[st.hist.length-1]:'start'}
V.practice=()=>{const s=SC[st.sc],id=cur(),sc=s.s[id];
return `<h2>${s.title}</h2><div class="cols"><aside class="card"><h3>Objective</h3><p>${t(s.obj)}</p><details><summary style="min-height:48px;cursor:pointer;font-weight:700">💡 Need a hint?</summary><p>${t(s.hint)}</p></details>${bot(t(['No pressure. You can always go back.','Koi dabao nahi. Aap hamesha wapas ja sakte hain.']))}</aside>
<section><div class="phone" aria-label="Simulated phone"><div class="scr"><small style="color:#087F83;font-weight:700">${sc.app} · SIMULATION</small><h3>${sc.h}</h3><p>${sc.b[0]}</p><div class="pop">${sc.o.length?sc.o.map(o=>`<button class="${o[2]}" data-opt="${o[1]}">${o[0]}</button>`).join(''):'<small>✔ Simulation complete. Use Go Back to try another option.</small>'}</div></div></div>
<p style="text-align:center"><button data-act="back" ${st.hist.length?'':'disabled'}>⏪ Go Back</button> <button data-act="reset">🔄 Try Again</button> <button class="g" data-act="cont" ${sc.end?'':'disabled'}>Continue</button></p></section>
<aside class="card" aria-live="polite"><h3>What happened?</h3><p>${t(sc.w)}</p><h3>Takeaway</h3><p>${t(sc.k)}</p><h3>Action History</h3><ol class="tl">${st.hist.length?st.hist.map((h,i)=>`<li>${i+1}. ${st.lab[i]}</li>`).join(''):'<li>Opened the fictional app</li>'}</ol></aside></div>`};
V.whatif=()=>{const s=SC.perm.s,sel=st.wi,ks=[['allow','ALLOW','p','The app receives the requested access in this simulation.'],['deny','DON’T ALLOW','t','The app cannot access the requested information in this simulation.'],['once','ALLOW ONCE','o','The app receives temporary access in this simulation.']];
return `<h1>What happens if you choose differently?</h1><p>The app asks to see your contacts. Pick a path to compare.</p><div class="card" style="text-align:center;margin-bottom:16px"><b>📱 Photo Magic asks for contacts</b><div style="font-size:30px">⬇ ⬇ ⬇</div></div><div class="three">${ks.map(k=>`<div class="card" style="${sel==k[0]?'outline:6px solid var(--gold)':''}"><h3>${k[1]}</h3><p>${k[3]}</p><button class="${k[2]}" data-wi="${k[0]}">See result</button></div>`).join('')}</div>
${sel?`<div class="card" style="margin-top:20px;border-color:var(--green)"><h3>${s[sel].h}</h3><p>${t(s[sel].w)}</p><p><b>${t(s[sel].k)}</b></p></div>`:'<p>Choose one to see the result.</p>'}<p>Compare: Allow = open access · Don’t Allow = fully private · Allow Once = temporary.</p><p><button class="p" data-go="done">Finish</button> <button data-go="explore">Explore</button></p>`};
V.learn=()=>`<h1>Every mistake teaches something.</h1><div class="card">${st.log.length?`<ol class="tl">${st.log.map(l=>`<li><b>${l.a}</b><br>What happened: ${l.w}<br>What to try differently: ${l.k}</li>`).join('')}</ol>`:'<p>Your timeline is empty. Try a practice and it will appear here, step by step.</p>'}</div><div style="margin:16px 0">${bot(t(['Every step teaches something new!','Har step se kuch naya seekhne ko milta hai!']))}</div><button class="p" data-go="explore">Explore Another Scenario</button>`;
V.done=()=>`<div class="border"><h1 style="text-align:center">Well Done! You Did It!</h1>${scene(ch('chaibot',470,230,110),1)}<div class="three" style="margin-top:14px"><div class="card"><h3>${done()}</h3>activities completed</div><div class="card"><h3>${Object.keys(pr.seen).length}</h3>decisions explored</div><div class="card"><h3>${Object.keys(pr.badges).length}</h3>badges earned</div></div><p style="text-align:center">You explored with curiosity. That is exactly how everyone learns. Chai break?</p><div style="text-align:center">${badges()}</div></div><p style="text-align:center"><button class="p" data-go="explore">Explore Another Scenario</button> <button class="t" data-go="whatif">Try What-If</button> <button data-go="home">Return Home</button></p>`;
const FAM=[['ahmed','Ahmed Uncle','The Everyday Explorer','Curious, practical, cheerful and adventurous.','A friendly, middle-aged father who enjoys discovering new things on his smartphone. Sometimes he knows exactly what to do, sometimes he is confused. He represents anyone who wants to feel more confident.','Aaj kuch naya seekhtay hain!'],
['bashir','Bashir Chacha','The Question Master','Curious, thoughtful, humorous and observant.','An elderly, bald uncle with large spectacles and a walking stick. He is never afraid to ask what a button does or why an app needs permission.','Beta, pehle samjhao, phir click karenge!'],
['shabana','Shabana Aunty','The Confidence Booster','Caring, patient, optimistic and encouraging.','A warm-hearted grandmother who loves her chai and believes learning has no age limit. She encourages everyone to take their time and never feel embarrassed.','Seekhnay ki koi umar nahi hoti!'],
['chaibot','ChaiBot','The Digital Guide','Helpful, cheerful, calm, intelligent and reassuring.','The chai-loving robot with a tiny cup, expressive eyes and a truck-art body. It explains consequences, helps you rewind mistakes and never judges.','Aray, koi baat nahi! Dobara try karte hain.'],
['mano','Mano','The Little Joy','Playful, curious, mischievous and adorable.','The family’s ginger-and-white cat. She chases colourful yarn, naps on cushions and may not understand technology, but she makes everyone smile.','Meow! Itna socho mat, explore karo!']];
V.meet=()=>`<h1>Meet Your Befikar Buddies!</h1><p>Every learning journey is better with a little company. Meet the friendly faces who will help you explore technology, one click at a time.</p>${scene(ch('chaibot',470,230,110))}<h2 style="margin-top:30px">The family</h2><div class="three">${FAM.map((f,i)=>`<button class="cc card" data-fam="${i}" aria-label="Open ${f[1]}" style="box-shadow:6px 6px 0 var(${['--teal','--red','--orange','--indigo','--green'][i]})"><div class="in"><svg viewBox="0 0 200 220" width="150" style="background:var(--peach);border-radius:20px;display:block;margin:auto">${CH[f[0]]}</svg><h3>${f[1]}</h3><b style="color:var(--red)">${f[2]}</b><p>${f[3]}</p><p class="f" style="color:var(--teal)">“${f[5]}”</p></div></button>`).join('')}</div>
<div class="border" style="margin-top:34px;text-align:center"><h2>Agar yeh kar sakte hain, toh aap kyun nahi?</h2><p>Ahmed Uncle is learning. Bashir Chacha is asking questions. Shabana Aunty is exploring. And you can too!</p><p>Technology has no age limit. You don’t need to be an expert, and you don’t need to get everything right on your first try.</p><p>With a little curiosity, a little practice and a cup of chai, you can learn too.</p><p><button class="p" data-go="explore">Start Exploring</button></p><p><b>Make mistakes. Learn freely. Try again.</b></p></div>`;
// ---------- app ----------
const NAV=[['home','Home'],['explore','Explore'],['meet','Meet the Family'],['how','How It Works']];
let page='home';
function nav(){document.getElementById('nav').innerHTML=`<button class="logo" data-go="home">☕ Chai &amp; Clicks</button>${NAV.map(n=>`<button class="l ${page==n[0]?'on':''}" data-go="${n[0]}" ${page==n[0]?'aria-current="page"':''}>${n[1]}</button>`).join('')}<button class="sw" aria-pressed="${st.desi}" data-act="desi">Desi Mode: ${st.desi?'ON':'OFF'}</button><button class="sw" aria-pressed="${st.easy}" data-act="easy">Easy View</button><button class="sw" aria-pressed="${st.sound}" data-act="sound">${st.sound?'🔊':'🔇'} Sound</button>`}
function go(p){page=p;if(p!='practice'&&location.hash!='#'+p)history.replaceState(null,'','#'+p);render();scrollTo(0,0)}
function render(){nav();document.getElementById('app').innerHTML=(V[page]||V.home)();const ex=page=='practice'||page=='intro'?'':'';}
function speak(x){if(!st.sound||!window.speechSynthesis)return;try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(x))}catch(e){}}
function reset(){st.hist=[];st.lab=[]}
function choose(o){const s=SC[st.sc],ns=s.s[o],lab=s.s[cur()].o.find(x=>x[1]==o)[0];st.hist.push(o);st.lab.push(lab);pr.seen[st.sc+o]=1;give('first');
 st.log.push({a:lab,w:t(ns.w),k:t(ns.k)});if(ns.end){pr.done[st.sc]=1;if(ns.badge)give(ns.badge);if(Object.keys(pr.seen).filter(k=>k.startsWith(st.sc)).length>=3)give('fearless');if(done()==3)give('befikar')}save();render();speak(t(ns.w))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-intro],[data-opt],[data-act],[data-wi],[data-fam]');if(!b)return;const d=b.dataset;
 if(d.go){if(d.go=='practice')reset();go(d.go)}
 else if(d.intro){st.sc=d.intro;reset();go('intro')}
 else if(d.opt)choose(d.opt);
 else if(d.wi){st.wi=d.wi;pr.seen['perm'+d.wi]=1;give('first');save();render()}
 else if(d.fam!==undefined){const f=FAM[d.fam],dl=document.getElementById('dlg');dl.innerHTML=`<svg viewBox="0 0 200 220" width="220" style="background:var(--peach);border-radius:24px;display:block;margin:auto">${CH[f[0]]}</svg><h2>${f[1]}</h2><b>${f[2]}</b><p>${f[4]}</p><p class="f" style="color:var(--teal);font-size:24px">“${f[5]}”</p><button class="p" id="cl">Close</button>`;dl.showModal();document.getElementById('cl').onclick=()=>dl.close()}
 else switch(d.act){
 case 'desi':st.desi=!st.desi;render();break;
 case 'easy':st.easy=!st.easy;document.body.classList.toggle('easy',st.easy);render();break;
 case 'sound':st.sound=!st.sound;render();speak('Sound is on. Chai ke saath, technology ki baat!');break;
 case 'listen':{const w=st.sound;st.sound=1;speak(t(SC[st.sc].intro));st.sound=w;break}
 case 'back':if(st.hist.length){st.hist.pop();st.lab.pop();st.log.push({a:'Rewound one step',w:'The simulation returned to the earlier screen.',k:'Rewinding is always allowed. Try another option.'});give('rewind');save();render()}break;
 case 'reset':reset();render();break;
 case 'cont':{go(st.sc=='perm'?'whatif':'learn')}}
});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(V[h]&&h!=page&&h!='practice')go(h)});
st.lab=[];const h0=location.hash.slice(1);if(V[h0]&&h0!='practice'&&h0!='intro')page=h0;render();
</script></body></html>
